<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Alarm Board</title>
  </head>
  <body>
    <h1>Live alarms</h1>
    <ul id="alarms"></ul>

    <h2>Zone alarms</h2>
    <ul id="zoneAlarms"></ul>

    <h2>Insights</h2>
    <ul id="insights"></ul>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script>
      const connection = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/alarms")
        .withAutomaticReconnect()
        .build();

      function showAlarm(alarm) {
        console.log("received", alarm);

        const li = document.createElement("li");
        li.textContent = `${alarm.timestamp} ${alarm.area} ${alarm.tagName} ${alarm.priority}`;
        document.getElementById("alarms").prepend(li);
      }

      function showZoneAlarm(zoneAlarm) {
        console.log("Zone Alarm", zoneAlarm);
        const li = document.createElement("li");

        li.textContent = `${zoneAlarm.raisedAt} ${zoneAlarm.area} ${zoneAlarm.alarmCount} alarms in ${zoneAlarm.windowSeconds}s`;

        document.getElementById("zoneAlarms").prepend(li);
      }

      function showInsight(insight) {
        console.log("insight", insight);
        const li = document.createElement("li");
        li.textContent = `${insight.area}: ${insight.summary}. ${insight.recommendation} (${insight.source})`;
        document.getElementById("insights").prepend(li);
      }

      connection.on("AlarmRaised", showAlarm);
      connection.on("ZoneAlarmRaised", showZoneAlarm);
      connection.on("InsightReady", showInsight);

      connection.onreconnected(() =>
        connection.invoke("WatchArea", "Sector 7 Foundry"),
      );

      connection
        .start()
        .then(() => connection.invoke("WatchArea", "Sector 7 Foundry"))
        .then(() => console.log("Watching Sector 7 Foundry"))
        .catch((err) => console.error(err));
    </script>
  </body>
</html>
